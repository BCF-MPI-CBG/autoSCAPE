name: napari-autoscape
display_name: autoSCAPE
# use 'hidden' to remove plugin from napari hub search results
visibility: public
# see https://napari.org/stable/plugins/technical_references/manifest.html#fields for valid categories
categories: ["Annotation", "Segmentation", "Acquisition"]
contributions:
  commands:
    - id: napari-autoscape.write_single_shape
      python_name: napari_autoscape._writer:write_single_shape
      title: Save image data with autoSCAPE
    - id: napari-autoscape.tesselate
      python_name: napari_autoscape:tesellate_area
      title: Create tile grid
    - id: napari-autoscape.detect_focusplane
      python_name: napari_autoscape:fit_focus_plane
      title: Fit focus plane
    - id: napari-autoscape.create_well_grid
      python_name: napari_autoscape:create_well_grid
      title: Create well grid
  writers:
    - command: napari-autoscape.write_single_shape
      layer_types: ['shapes']
      filename_extensions: ['.pos']
  widgets:
    - command: napari-autoscape.tesselate
      display_name: Create tile grid
      autogenerate: true
    - command: napari-autoscape.detect_focusplane
      display_name: Fit focus plane
      autogenerate: true
    - command: napari-autoscape.create_well_grid
      display_name: Create well grid
      autogenerate: true
