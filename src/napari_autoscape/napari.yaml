name: napari-autoscape
display_name: autoSCAPE
# use 'hidden' to remove plugin from napari hub search results
visibility: public
# see https://napari.org/stable/plugins/technical_references/manifest.html#fields for valid categories
categories: ["Annotation", "Segmentation", "Acquisition"]
contributions:
  commands:
    - id: napari-autoscape.get_reader
      python_name: napari_autoscape._reader:napari_get_reader
      title: Open data with autoSCAPE
    - id: napari-autoscape.write_multiple
      python_name: napari_autoscape._writer:write_multiple
      title: Save multi-layer data with autoSCAPE
    - id: napari-autoscape.write_single_image
      python_name: napari_autoscape._writer:write_single_image
      title: Save image data with autoSCAPE
    - id: napari-autoscape.make_sample_data
      python_name: napari_autoscape._sample_data:make_sample_data
      title: Load sample data from autoSCAPE
    - id: napari-autoscape.make_container_widget
      python_name: napari_autoscape:ImageThreshold
      title: Make threshold Container widget
    - id: napari-autoscape.make_magic_widget
      python_name: napari_autoscape:threshold_magic_widget
      title: Make threshold magic widget
    - id: napari-autoscape.make_function_widget
      python_name: napari_autoscape:threshold_autogenerate_widget
      title: Make threshold function widget
    - id: napari-autoscape.make_qwidget
      python_name: napari_autoscape:ExampleQWidget
      title: Make example QWidget
  readers:
    - command: napari-autoscape.get_reader
      accepts_directories: false
      filename_patterns: ['*.npy']
  writers:
    - command: napari-autoscape.write_multiple
      layer_types: ['image*','labels*']
      filename_extensions: []
    - command: napari-autoscape.write_single_image
      layer_types: ['image']
      filename_extensions: ['.npy']
  sample_data:
    - command: napari-autoscape.make_sample_data
      display_name: autoSCAPE
      key: unique_id.1
  widgets:
    - command: napari-autoscape.make_container_widget
      display_name: Container Threshold
    - command: napari-autoscape.make_magic_widget
      display_name: Magic Threshold
    - command: napari-autoscape.make_function_widget
      autogenerate: true
      display_name: Autogenerate Threshold
    - command: napari-autoscape.make_qwidget
      display_name: Example QWidget
