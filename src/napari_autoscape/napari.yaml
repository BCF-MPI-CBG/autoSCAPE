name: napari-autoscape
display_name: autoSCAPE
# use 'hidden' to remove plugin from napari hub search results
visibility: public
# see https://napari.org/stable/plugins/technical_references/manifest.html#fields for valid categories
categories: ["Annotation", "Segmentation", "Acquisition"]
contributions:
  commands:
    - id: napari-autoscape.get_reader
      python_name: napari_autoscape._reader:napari_get_reader
      title: Open data with autoSCAPE
    - id: napari-autoscape.write_multiple
      python_name: napari_autoscape._writer:write_multiple
      title: Save multi-layer data with autoSCAPE
    - id: napari-autoscape.write_single_image
      python_name: napari_autoscape._writer:write_single_image
      title: Save image data with autoSCAPE
    - id: napari-autoscape.make_sample_data
      python_name: napari_autoscape._sample_data:make_sample_data
      title: Load sample data from autoSCAPE
    - id: napari-autoscape.tesselate
      python_name: napari_autoscape:tesellate_area
      title: Tesellate acquisition area
  readers:
    - command: napari-autoscape.get_reader
      accepts_directories: true
      filename_patterns: ['*.tif']
  writers:
    - command: napari-autoscape.write_multiple
      layer_types: ['image*','labels*']
      filename_extensions: []
    - command: napari-autoscape.write_single_image
      layer_types: ['image']
      filename_extensions: ['.npy']
  sample_data:
    - command: napari-autoscape.make_sample_data
      display_name: autoSCAPE
      key: unique_id.1
  widgets:
    - command: napari-autoscape.tesselate
      display_name: Tesselate Acquisition Area
      autogenerate: true